name: Run tests

# триггер
on: [ push, workflow_dispatch ]

# права на запись нужны, чтобы пушить отчёт в ветку gh-pages
permissions:
  contents: write

jobs: # аналог этапов
  run-tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-latest
    steps: # шаги конкретной job
      - name: Checkout repository # копируем файлы репозитория внутрь CI агента
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up services
        working-directory: infra/docker_compose
        run: bash restart_docker.sh

      - name: Wait for services
        run: |
          docker ps -a
          for i in $(seq 1 30); do
            if docker exec nbank-postgres pg_isready -U postgres; then break; fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4111/v3/api-docs > /dev/null; then break; fi
            sleep 2
          done
          docker logs nbank-postgres --tail 30

      - name: Debug database
        run: |
          docker ps -a
          (ss -ltn | grep 5432) || echo "port 5432 is NOT listening"
          docker logs nbank-postgres --tail 50
          docker exec nbank-postgres psql -U postgres -d nbank -c '\dt' || true

      - name: Download swagger-coverage-commandline
        run: |
          wget -q https://github.com/viclovsky/swagger-coverage/releases/download/1.5.0/swagger-coverage-1.5.0.zip
          unzip -q swagger-coverage-1.5.0.zip -d swagger-coverage
          chmod +x $(find swagger-coverage -path '*bin/swagger-coverage-commandline')

      - name: Run tests
        # -Papi: только API-тесты (в docker-compose пока нет frontend для UI-тестов)
        run: mvn clean test -q -Papi
        env:
          APIBASEURL: http://localhost:4111
          UIBASEURL: http://frontend
          APIVERSION: /api/v1

      - name: Run Swagger coverage
        if: always()
        continue-on-error: true
        run: |
          OUT=$(find . -type d -name swagger-coverage-output -not -path "./swagger-coverage/*" | head -1)
          if [ -z "$OUT" ]; then
            echo "::warning::Папка swagger-coverage-output не найдена: тесты не записали данные о