name: Run tests

# триггер
on: [ push, workflow_dispatch ]

permissions:
  contents: write # нужно, чтобы публиковать отчёты в gh-pages

jobs: # аналог этапов
  run-tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-latest
    steps: # шаги конкретной job
      - name: Checkout repository # копируем файлы репозитория внутрь CI агента
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Swagger Coverage
        run: |
          wget -q https://github.com/viclovsky/swagger-coverage/releases/download/1.5.0/swagger-coverage-1.5.0.zip -O swagger-coverage.zip
          unzip -q swagger-coverage.zip -d swagger-coverage-tmp
          BIN=$(find swagger-coverage-tmp -type f -name swagger-coverage-commandline -path '*/bin/*' | head -n 1)
          SRC=$(dirname "$(dirname "$BIN")")
          mkdir -p .swagger-coverage-commandline
          cp -r "$SRC"/. .swagger-coverage-commandline/
          chmod +x .swagger-coverage-commandline/bin/swagger-coverage-commandline
          rm -rf swagger-coverage-tmp swagger-coverage.zip

      - name: Set up services
        run: cd infra/docker_compose && bash restart_docker.sh && cd ../..

      - name: Run tests
        run: mvn clean test -q
        env:
          APIBASEURL: http://localhost:4111
          UIBASEURL: http://frontend
          APIVERSION: /api/v1

      - name: Run Swagger coverage
        if: always()
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s http://localhost:4111/v3/api-docs -i target/swagger-coverage-output

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true # если ветки gh-pages ещё нет
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install Allure CLI
        if: always()
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          sudo tar -xzf allure-2.24.0.tgz -C /opt
          sudo ln -sf /opt/allure-2.24.0/bin/allure /usr/local/bin/allure

      - name: Build test report
        if: always()
        run: |
          mkdir -p allure-history target/allure-results

          # переносим старые отчёты из gh-pages
          if [ -d gh-pages ]; then
            cp -r gh-pages/. allure-history/
            rm -rf allure-history/.git
          fi

          # подтягиваем историю прошлого прогона
          if [ -d allure-history/last-history ]; then
            mkdir -p target/allure-results/history
            cp -r allure-history/last-history/. target/allure-results/history/
          fi

          # генерируем новый отчёт
          allure generate target/allure-results --clean -o allure-report

          # кладём отчёт в папку с номером запуска
          mkdir -p allure-history/${{ github.run_number }}
          cp -r allure-report/. allure-history/${{ github.run_number }}/

          # сохраняем историю для следующего прогона
          rm -rf allure-history/last-history
          mkdir -p allure-history/last-history
          cp -r allure-report/history/. allure-history/last-history/

          # главная страница ведёт на последний отчёт
          echo '<meta http-equiv="refresh" content="0; url=${{ github.run_number }}/index.html">' > allure-history/index.html

          # храним только 20 последних отчётов
          ls -1 allure-history | grep -E '^[0-9]+$' | sort -n | head -n -20 | xargs -r -I{} rm -rf allure-history/{}

      - name: Build Swagger coverage report
        if: always()
        run: |
          if [ -f swagger-coverage-report.html ]; then
            cp swagger-coverage-report.html allure-history/${{ github.run_number }}/
          else
            echo "swagger-coverage-report.html not found, skipping"
          fi

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Clean up services
        if: always()
        run: cd "$GITHUB_WORKSPACE/infra/docker_compose" && docker compose down